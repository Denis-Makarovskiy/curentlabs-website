name: Publish Pages on dedicated server
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: [self-hosted, Linux, X64, denis-ci, "${{ format('denis-run-{0}-{1}', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Copy static site
        run: |
          mkdir _site
          rsync -a --exclude='.*' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
